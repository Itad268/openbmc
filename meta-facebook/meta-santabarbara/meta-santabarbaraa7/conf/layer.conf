# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "santabarbaraa7-layer"
BBFILE_PATTERN_santabarbaraa7-layer := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_santabarbaraa7-layer := "wrynose whinlatter"
